name: JARVIS Architecture Core Tests

on:
  push:
    branches: [architecture/core-foundation]
    paths: ['architecture-core/**', '.github/workflows/architecture-core-tests.yml']
  pull_request:
    paths: ['architecture-core/**', '.github/workflows/architecture-core-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run architecture core unit tests
        working-directory: architecture-core
        run: gradle test --no-daemon

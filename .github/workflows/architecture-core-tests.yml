name: JARVIS Architecture Core Tests

on:
  push:
    branches: [architecture/core-foundation]
    paths: ['architecture-core/**', '.github/workflows/architecture-core-tests.yml']
  pull_request:
    paths: ['architecture-core/**', '.github/workflows/architecture-core-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run architecture core unit tests
        working-directory: architecture-core
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/architecture-core-gradle.log"
          for attempt in 1 2 3 4; do
            echo "Gradle test attempt $attempt of 4"
            if gradle test --no-daemon 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -Eiq 'status code (429|5[0-9]{2})|Too Many Requests|Could not GET|temporarily unavailable|timed out' "$log_file"; then
              echo "Non-transient Gradle failure; stopping without retry."
              exit 1
            fi

            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 20))
              echo "Transient repository/network error detected. Retrying in $delay seconds..."
              sleep "$delay"
            fi
          done

          echo "Gradle tests failed after 4 attempts."
          exit 1

                                      val tokens = probeHint.split(Regex("\\s+")).filter { it.isNotBlank() }
                                      val matchesRegion = (0 until probeResults.length()).map { probeResults.getJSONObject(it) }
                                          .filter { item ->
                                              val metadata = (item.optString("admin1") + " " + item.optString("country")).lowercase(Locale.ROOT)
                                              tokens.all { metadata.contains(it.lowercase(Locale.ROOT)) }
                                          }
                                      if (matchesRegion.isNotEmpty()) {
                                          results = probeResults
                                          searchText = probeText
                                          regionHint = probeHint
                                          regionMatched = true
                                      }
                                  }
                              }
                          }
                          """
          if s.count(anchor) != 1:
              raise SystemExit("Could not uniquely locate weather candidate selection")
          s = s.replace(anchor, probe + "\n                          " + anchor, 1)

          old = "val scopedCandidates = if (hintTokens.isNotEmpty() && regionMatches.isNotEmpty()) regionMatches else candidates"
          new = "val scopedCandidates = if (hintTokens.isNotEmpty()) regionMatches else candidates"
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely locate region-scoping rule")
          s = s.replace(old, new, 1)

          old = "val rankedCandidates = if (exactMatches.isNotEmpty()) exactMatches else scopedCandidates"
          new = "val rankedCandidates = if (exactMatches.isNotEmpty()) exactMatches else if (hintTokens.isNotEmpty()) regionMatches else scopedCandidates"
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely locate candidate ranking rule")
          s = s.replace(old, new, 1)

          old = "if (labels.size > 1) {"
          new = "if (rankedCandidates.isEmpty() || labels.size > 1) {"
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely locate ambiguity guard")
          s = s.replace(old, new, 1)

          old = '''message = "I found more than one place matching $city: " +
                                  labels.take(5).joinToString("; ") +
                                  ". Please ask again and include the state or country."'''
          new = '''message = if (labels.isEmpty()) {
                                  "I could not match $city to the supplied region. Please check the city and state or country."
                              } else {
                                  "I found more than one place matching $city: " +
                                      labels.take(5).joinToString("; ") +
                                      ". Please include the state or country."
                              }'''
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely locate weather clarification message")
          s = s.replace(old, new, 1)

          path.write_text(s)
          print("Region hints now filter geocoding candidates; unmatched hints cannot fall back to a wrong country.")
          PY

      - name: Add JARVIS conversation context engine
        run: |
          cat > "$PROJECT_DIR/app/src/main/java/com/jps/jarvis/JarvisConversationContext.kt" <<'KOTLIN'
          package com.jps.jarvis

          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * Builds a bounded, chronological conversation context for online AI requests.
           * The app keeps the full local history; only the most recent eight complete
           * user/assistant turns are sent with the current text request.
           */
          object JarvisConversationContext {
              private const val MAX_CONTEXT_TURNS = 8

              private const val SYSTEM_GUIDANCE = """
          You are JARVIS, a capable personal AI assistant.
          Understand the user's meaning rather than responding to isolated keywords.
          Use the recent conversation to interpret short replies and follow-up questions.
          Keep the active topic when the user answers a clarification question.
          If essential information is missing or a result is uncertain, ask a concise clarification.
          Never invent live data, claim an action succeeded when it did not, or pretend to have used a tool.
          Be direct, useful, and natural. Do not expose internal reasoning.
          """

              fun buildMessages(history: List<String>, currentInput: String): JSONArray {
                  val messages = JSONArray()
                  messages.put(
                      JSONObject()
                          .put("role", "system")
                          .put("content", SYSTEM_GUIDANCE.trim())
                  )

                  val turns = history.takeLast(MAX_CONTEXT_TURNS).mapNotNull { parseTurn(it) }
                  for (turn in turns) {
                      messages.put(JSONObject().put("role", "user").put("content", turn.first))
                      messages.put(JSONObject().put("role", "assistant").put("content", turn.second))
                  }

                  messages.put(JSONObject().put("role", "user").put("content", currentInput.trim()))
                  return messages
              }

              private fun parseTurn(entry: String): Pair<String, String>? {
                  val userMarker = "\nYou: "
                  val assistantMarker = "\nJARVIS: "
                  val userStart = entry.indexOf(userMarker)
                  if (userStart < 0) return null
                  val assistantStart = entry.indexOf(assistantMarker, userStart + userMarker.length)
                  if (assistantStart < 0) return null

                  val userText = entry.substring(userStart + userMarker.length, assistantStart).trim()
                  val assistantText = entry.substring(assistantStart + assistantMarker.length).trim()
                  if (userText.isBlank() || assistantText.isBlank()) return null
                  return userText to assistantText
              }
          }
          KOTLIN
          echo "Bounded JARVIS conversation context engine added."

      - name: Add structured JARVIS intent router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          s = path.read_text()
          old = "    private fun handleLocalCommand(raw: String) {"
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely locate the existing command handler")
          s = s.replace(old, "    private fun handleClassifiedLocalCommand(raw: String) {", 1)

          anchor = "    private fun handleClassifiedLocalCommand(raw: String) {"
          if s.count(anchor) != 1:
              raise SystemExit("Could not locate renamed command handler")
          methods = r'''    /**
           * Online requests are classified centrally before JARVIS selects a capability.
           * Strictly local commands and an active weather-city clarification remain offline.
           */
          private fun handleLocalCommand(raw: String) {
              val command = raw.trim().lowercase(Locale.ROOT)
              if (command.isBlank()) return
              if (pendingWeatherCity || isKnownOfflineCommand(command)) {
                  handleClassifiedLocalCommand(raw)
                  return
              }
              understandAndRoute(raw)
          }

          private fun isKnownOfflineCommand(command: String): Boolean {
              return command == "hello" || command == "hi jarvis" ||
                  command.contains("stop listening") ||
                  command.matches(Regex(".*\\b(what time is it|tell me the time|current time|time)\\b.*")) ||
                  command.matches(Regex(".*\\b(what is the date|what's the date|today's date|what day is it)\\b.*")) ||
                  command.contains("open settings") || command.contains("open camera") ||
                  command.contains("open wifi") || command.contains("wi-fi settings") ||
                  command.contains("wifi settings") || command.contains("bluetooth settings") ||
                  command.contains("display settings") || command.contains("screen settings") ||
                  command.contains("volume up") || command.contains("increase volume") ||
                  command.contains("volume down") || command.contains("decrease volume") ||
                  command.contains("battery")
          }

          private fun understandAndRoute(raw: String) {
              statusText = "Understanding your request…"
              val historySnapshot = historyItems.toList()
              Thread {
                  var result: JSONObject? = null
                  var failure = "I could not reach JARVIS intent understanding. Please check your connection and try again."
                  var connection: HttpURLConnection? = null
                  try {
                      connection = (URL(JarvisConfig.WORKER_URL + "/intent").openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          connectTimeout = 15000
                          readTimeout = 45000
                          doOutput = true
                          setRequestProperty("Authorization", "Bearer " + JarvisConfig.CLIENT_TOKEN)
                          setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      }
                      val messages = JarvisConversationContext.buildMessages(historySnapshot, raw)
                      val payload = JSONObject().put("messages", messages).put("input", raw).toString()
                      connection.outputStream.use { it.write(payload.toByteArray(Charsets.UTF_8)) }
                      val code = connection.responseCode
                      val stream = if (code in 200..299) connection.inputStream else connection.errorStream
                      val body = stream?.bufferedReader()?.use { it.readText() }.orEmpty()
                      if (code !in 200..299) {
                          throw IllegalStateException("Intent endpoint returned HTTP $code: " + JSONObject(body).optString("error"))
                      }
                      result = JSONObject(body)
                  } catch (e: Exception) {
                      android.util.Log.e("JARVIS", "Intent understanding failed", e)
                      failure = if (e.message?.contains("HTTP 404") == true) {
                          "JARVIS intent service is not installed on the Cloudflare Worker yet. Update the Worker and try again."
                      } else failure
                  } finally {
                      connection?.disconnect()
                  }

                  runOnUiThread {
                      if (isFinishing || isDestroyed) return@runOnUiThread
                      if (result == null) {
                          reply = failure
                          statusText = "Intent service unavailable"
                          speak(failure)
                          return@runOnUiThread
                      }
                      executeWithArchitectureCore(raw, result!!)
                  }
              }.start()
          }

          /**
           * Every cloud-classified request must pass the shared capability registry,
           * plan validator and execution engine before an app action is dispatched.
           */
          private fun executeWithArchitectureCore(raw: String, data: JSONObject) {
              val registry = com.jps.jarvis.core.CapabilityRegistry.initial()
              val requestId = java.util.UUID.randomUUID().toString()
              val intent = data.optString("intent", "clarify").lowercase(Locale.ROOT)
              val capability = when (intent) {
                  "weather" -> "weather.current"
                  "image_generate" -> "image.generate"
                  "image_edit" -> "image.edit"
                  "navigation" -> "navigation.route"
                  else -> "assistant.answer"
              }
              val request = com.jps.jarvis.core.AssistantRequest(
                  requestId = requestId,
                  sessionId = "jarvis-android",
                  inputText = raw,
                  advertisedCapabilities = registry.advertisedAvailableIds(),
                  microphoneEnabled = false,
                  locationMode = "user_supplied_only"
              )
              val plan = com.jps.jarvis.core.AssistantPlan(
                  requestId = requestId,
                  taskId = java.util.UUID.randomUUID().toString(),
                  summary = "Handle the user's request",
                  steps = listOf(
                      com.jps.jarvis.core.PlannedStep(
                          stepId = "dispatch-1",
                          capability = capability
                      )
                  )
              )
              val bindings = registry.all().filter { it.available }.map { descriptor ->
                  com.jps.jarvis.core.CapabilityExecutorBinding(
                      descriptor.id,
                      com.jps.jarvis.core.CapabilityExecutor { _, _, _ ->
                          dispatchClassifiedIntent(raw, data)
                          com.jps.jarvis.core.CapabilityExecutionOutput(
                              values = mapOf("dispatched" to "true")
                          )
                      }
                  )
              }
              val engine = com.jps.jarvis.core.PlanExecutionEngine(registry, bindings)
              val start = com.jps.jarvis.core.TaskStateMachine.transition(
                  com.jps.jarvis.core.TaskStatus.PLANNED,
                  com.jps.jarvis.core.TaskStatus.RUNNING
              )
              if (start !is com.jps.jarvis.core.TransitionResult.Accepted) {
                  val message = "I couldn't safely start that task. Please try again."
                  reply = message
                  statusText = "Task could not start"
                  speak(message)
                  return
              }
              val report = engine.execute(request, plan)
              com.jps.jarvis.core.TaskStateMachine.transition(
                  com.jps.jarvis.core.TaskStatus.RUNNING,
                  report.status
              )
              when {
                  report.status == com.jps.jarvis.core.TaskStatus.SUCCEEDED -> Unit
                  report.results.any { it.status == com.jps.jarvis.core.StepStatus.UNAVAILABLE } ||
                      report.validationErrors.any { it.startsWith("capability_unavailable:") } -> {
                      // Keep the existing honest user-facing explanation for capabilities
                      // that are registered but not yet implemented on this device.
                      dispatchClassifiedIntent(raw, data)
                  }
                  else -> {
                      android.util.Log.w("JARVIS", "Core rejected task: " + report.validationErrors.joinToString())
                      val message = "I couldn't safely process that request. Please try rephrasing it."
                      reply = message
                      statusText = "Task validation failed"
                      speak(message)
                  }
              }
          }

          private fun dispatchClassifiedIntent(raw: String, data: JSONObject) {
              val intent = data.optString("intent", "clarify").lowercase(Locale.ROOT)
              val confidence = data.optDouble("confidence", 0.0).coerceIn(0.0, 1.0)
              val entities = data.optJSONObject("entities") ?: JSONObject()
              val clarification = data.optString("clarification").trim()

              if (confidence < 0.55 && intent != "general") {
                  val message = clarification.ifBlank {
                      "I’m not fully sure what you want me to do. Could you rephrase that?"
                  }
                  reply = message
                  statusText = "Please clarify"
                  speak(message)
                  return
              }

              when (intent) {
                  "weather" -> {
                      val city = entities.optString("city").trim().ifBlank { extractWeatherCity(raw) }
                      if (city.isBlank()) {
                          pendingWeatherCity = true
                          val message = "Which city should I check the weather for?"
                          reply = message
                          statusText = "Waiting for city"
                          speak(message)
                      } else {
                          fetchWeatherForCity(city)
                      }
                  }
                  "image_generate" -> {
                      val prompt = entities.optString("prompt").trim().ifBlank { raw }
                      askJarvisImage(prompt)
                  }
                  "image_edit" -> {
                      val message = "I understand you want to edit or regenerate an existing image. The current image service can create new images from text, but image editing is not connected yet."
                      reply = message
                      statusText = "Image editing not available yet"
                      speak(message)
                  }
                  "navigation" -> {
                      val message = "I understand this is a navigation request, but map navigation is not connected yet."
                      reply = message
                      statusText = "Navigation not connected yet"
                      speak(message)
                  }
                  "clarify" -> {
                      val message = clarification.ifBlank {
                          "Could you clarify what you would like me to do?"
                      }
                      reply = message
                      statusText = "Please clarify"
                      speak(message)
                  }
                  "general" -> askJarvisAI(raw)
                  else -> {
                      val message = "I could not confidently identify the capability needed for that request. Could you rephrase it?"
                      reply = message
                      statusText = "Please clarify"
                      speak(message)
                  }
              }
          }

          '''
          s = s.replace(anchor, methods + anchor, 1)
          path.write_text(s)
          print("Added central intent classification and explicit intent-to-capability dispatch.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build JARVIS APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Sign APK with permanent JARVIS key
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          JARVIS_STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          set -e
          umask 077
          python3 - <<'PY'
          import base64
          import os
          import re
          raw = os.environ["JARVIS_KEYSTORE_BASE64"]
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          try:
              data = base64.b64decode(cleaned, validate=True)
          except Exception as exc:
              raise SystemExit("JARVIS keystore secret is not valid base64: " + str(exc))
          if len(data) < 100:
              raise SystemExit("Decoded JARVIS keystore is unexpectedly small; check the repository secret")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "jarvis-release.jks"), "wb") as f:
              f.write(data)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/jarvis-release.jks" \
            --ks-key-alias jarvis \
            --ks-pass env:JARVIS_STORE_PASSWORD \
            --key-pass env:JARVIS_KEY_PASSWORD \
            --out "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug-signed.apk" \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug-signed.apk"
          rm -f "$RUNNER_TEMP/jarvis-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Xperia1V-APK
          path: '**/build/outputs/apk/debug/app-debug-signed.apk'
          if-no-files-found: error

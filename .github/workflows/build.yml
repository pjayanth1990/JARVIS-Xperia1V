      - name: Enforce strict microphone privacy mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PROJECT_DIR"])
          path = root / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          s = path.read_text()

          # Block manual recording before it can request Android microphone permission.
          import re
          request_match = re.search(r'(?m)^(\s*private fun requestListen\([^\n]*\) \{)', s)
          if not request_match:
              raise SystemExit("Could not find requestListen declaration (including optional parameters)")
          request_anchor = request_match.group(1)
          request_guard = request_anchor + """
                  if (!wakeWordEnabled) {
                      conversationActive = false
                      statusText = "Privacy Mode · microphone off"
                      return
                  }"""
          s = s[:request_match.start()] + request_guard + s[request_match.end():]

          # Central hard stop: all paths to SpeechRecognizer must pass this guard,
          # including wake-word callbacks, Android assistant intents and follow-ups.
          anchor = "    private fun listenOnce() {"
          guard = """    private fun listenOnce() {
                  if (!wakeWordEnabled) {
                      conversationActive = false
                      statusText = "Privacy Mode · microphone off"
                      return
                  }"""
          if s.count(anchor) != 1:
              raise SystemExit("Could not uniquely locate listenOnce")
          s = s.replace(anchor, guard, 1)

          # Discard any late recognizer result that arrives after the user switches privacy OFF.
          results_anchor = "override fun onResults(results: Bundle?) {"
          results_guard = """override fun onResults(results: Bundle?) {
                              if (!wakeWordEnabled) {
                                  try { recognizer.cancel() } catch (_: Exception) {}
                                  try { recognizer.destroy() } catch (_: Exception) {}
                                  if (activeRecognizer === recognizer) activeRecognizer = null
                                  conversationActive = false
                                  statusText = "Privacy Mode · microphone off"
                                  return
                              }"""
          if s.count(results_anchor) != 1:
              raise SystemExit("Could not uniquely locate recognition results callback")
          s = s.replace(results_anchor, results_guard, 1)

          # Make the UI reflect the actual hardware privacy state, not just the backend guard.
          old_button = 'Button(onClick = onListen, modifier = Modifier.fillMaxWidth()) {'
          new_button = 'Button(onClick = onListen, enabled = wakeWordEnabled, modifier = Modifier.fillMaxWidth()) {'
          if s.count(old_button) != 1:
              raise SystemExit("Could not uniquely locate TAP TO SPEAK button")
          s = s.replace(old_button, new_button, 1)
          s = s.replace(
              'else "Wake-word microphone is off. Tap to speak works only when requested."',
              'else "Microphone is fully disabled. Turn the microphone switch ON to use voice commands."',
              1
          )

          path.write_text(s)
          print("Strict privacy guard applied to manual, automatic and late speech-recognition paths")
          PY

      - name: Fix selected wake-word handoff and general city weather resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ["PROJECT_DIR"])
          main = root / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          service = root / "app/src/main/java/com/jps/jarvis/WakeWordService.kt"
          s = main.read_text()
          w = service.read_text()

          # Register a foreground-only receiver so a detected wake phrase starts
          # speech recognition without relying on a restricted background Activity launch.
          for imp in ("import android.content.BroadcastReceiver", "import android.content.IntentFilter"):
              if imp not in s:
                  anchor = "import android.content.Intent\n"
                  if anchor not in s:
                      raise SystemExit("Could not safely add Android broadcast imports")
                  s = s.replace(anchor, anchor + imp + "\n", 1)

          receiver = r'''
              private var wakeWordReceiverRegistered = false
              private val wakeWordReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: android.content.Context?, intent: Intent?) {
                      if (intent?.action == WakeWordService.ACTION_WAKE_WORD && wakeWordEnabled &&
                          getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).getBoolean("enabled", false)) {
                          if (activeRecognizer == null) requestListen(fromWakeWord = true)
                      }
                  }
              }

              override fun onStart() {
                  super.onStart()
                  getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).edit()
                      .putBoolean("app_foreground", true).apply()
                  if (!wakeWordReceiverRegistered) {
                      ContextCompat.registerReceiver(
                          this, wakeWordReceiver,
                          IntentFilter(WakeWordService.ACTION_WAKE_WORD),
                          ContextCompat.RECEIVER_NOT_EXPORTED
                      )
                      wakeWordReceiverRegistered = true
                  }
              }

              override fun onStop() {
                  getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).edit()
                      .putBoolean("app_foreground", false).apply()
                  if (wakeWordReceiverRegistered) {
                      try { unregisterReceiver(wakeWordReceiver) } catch (_: Exception) {}
                      wakeWordReceiverRegistered = false
                  }
                  super.onStop()
              }
          '''
          if "private val wakeWordReceiver = object" not in s:
              class_pos = s.find("class MainActivity")
              brace_pos = s.find("{", class_pos)
              if class_pos < 0 or brace_pos < 0:
                  raise SystemExit("Could not locate MainActivity class opening brace")
              s = s[:brace_pos + 1] + "\n" + receiver + s[brace_pos + 1:]

          # Model selection is already applied by the selectable-model step above.
          # Verify it remains preference-driven; never overwrite the user's saved choice.
          if 'getString("model", "HEY_JARVIS")' not in w or "selectedModel" not in w:
              raise SystemExit("Wake-word service is not using the saved model selection")

          # For foreground use, broadcast directly to the registered activity.
          # Keep the existing notification/PendingIntent fallback for background use.
          handoff = re.search(r'(?m)^(\s*)val launch = Intent\(this, MainActivity::class.java\)\.apply \{', w)
          if not handoff:
              raise SystemExit("Could not locate wake-word activity handoff")
          indent = handoff.group(1)
          broadcast = (
              indent + 'if (getSharedPreferences("jarvis_wake_word", MODE_PRIVATE)\n' +
              indent + '        .getBoolean("app_foreground", false)) {\n' +
              indent + '    sendBroadcast(Intent(ACTION_WAKE_WORD).setPackage(packageName))\n' +
              indent + '    manager.notify(NOTIFICATION_ID, makeNotification("Wake phrase detected — starting voice input"))\n' +
              indent + '    return@post\n' +
              indent + '}\n'
          )
          w = w[:handoff.start()] + broadcast + w[handoff.start():]

          # Request multiple geocoding candidates. Never hardcode a particular city
          # or silently choose an unrelated town/country when the name is ambiguous.
          geo_pattern = re.compile(
              r'(?m)^(?P<i>[ \t]*)val encodedCity = .*?\n(?P=i)val geoUrl = .*?$'
          )
          geo_matches = list(geo_pattern.finditer(s))
          if len(geo_matches) != 1:
              raise SystemExit("Could not uniquely locate the generated city geocoding block")
          i = geo_matches[0].group("i")
          geo_replacement = (
              i + 'val encodedCity = java.net.URLEncoder.encode(city.trim(), "UTF-8")\n' +
              i + 'val geoUrl = "https://geocoding-api.open-meteo.com/v1/search?name=$encodedCity&count=10&language=en&format=json"'
          )
          s = geo_pattern.sub(lambda _: geo_replacement, s, count=1)

          old_place = "val place = results.getJSONObject(0)"
          if s.count(old_place) != 1:
              raise SystemExit("Could not uniquely locate weather result selection")
          place_logic = r'''val candidates = (0 until results.length()).map { results.getJSONObject(it) }
                          val exactMatches = candidates.filter {
                              it.optString("name").trim().equals(city.trim(), ignoreCase = true)
                          }
                          val rankedCandidates = if (exactMatches.isNotEmpty()) exactMatches else candidates
                          fun placeLabel(item: JSONObject): String {
                              val name = item.optString("name", city)
                              val region = item.optString("admin1", "")
                              val countryName = item.optString("country", "")
                              return listOf(name, region, countryName).filter { it.isNotBlank() }.distinct().joinToString(", ")
                          }
                          val labels = rankedCandidates.map { placeLabel(it) }.distinct()
                          if (exactMatches.isEmpty() || labels.size > 1) {
                              message = "I found more than one place matching $city: " +
                                  labels.take(5).joinToString("; ") +
                                  ". Please ask again and include the state or country."
                              runOnUiThread {
                                  if (!isFinishing && !isDestroyed) {
                                      reply = message
                                      statusText = "Please clarify the city"
                                      speak(message)
                                  }
                              }
                              return@Thread
                          }
                          val place = rankedCandidates.maxByOrNull { it.optLong("population", 0L) }
                              ?: candidates.first()'''
          s = s.replace(old_place, place_logic, 1)

          main.write_text(s)
          service.write_text(w)
          print("Updated selected wake-word model handling, foreground wake handoff, and ambiguity-safe city geocoding")
          PY

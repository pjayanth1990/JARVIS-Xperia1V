              onCustomWakePhraseChange: (String) -> Unit,
              onImportCustomWakeModel: () -> Unit,""",
               "wake model screen parameters")

          methods = r"""
              private fun selectWakeModel(model: String) {
                  wakeModelChoice = model
                  getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).edit()
                      .putString("model", model).apply()
                  if (model == "CUSTOM" && !java.io.File(filesDir, "custom_wakeword.onnx").isFile) {

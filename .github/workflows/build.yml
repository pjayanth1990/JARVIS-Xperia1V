      - name: Add Hey JARVIS foreground microphone service
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/jps/jarvis"
          cat > "$PROJECT_DIR/app/src/main/java/com/jps/jarvis/WakeWordService.kt" <<'KOTLIN'
          package com.jps.jarvis

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.util.Log
          import androidx.core.app.NotificationCompat
          import com.openwakeword.OpenWakeWord

          class WakeWordService : Service() {
              companion object {
                  const val ACTION_WAKE_WORD = "com.jps.jarvis.ACTION_WAKE_WORD"
                  private const val CHANNEL_ID = "jarvis_wake_word"
                  private const val NOTIFICATION_ID = 5021
              }

              private var detector: OpenWakeWord? = null
              @Volatile private var detectionHandled = false

              override fun onCreate() {
                  super.onCreate()
                  getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).edit()
                      .putString("startup_stage", "service_created").apply()
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).edit()
                      .putString("startup_stage", "on_start_command").apply()
                  startForeground(NOTIFICATION_ID, makeNotification("Checking microphone access…"))
                  getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).edit()
                      .putString("startup_stage", "foreground_started").apply()
                  if (detector == null) {
                      detectionHandled = false
                      try {
                          val permission = androidx.core.content.ContextCompat.checkSelfPermission(
                              this, android.Manifest.permission.RECORD_AUDIO
                          )
                          if (permission != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              throw SecurityException("RECORD_AUDIO permission is not granted")
                          }
                          val minBuffer = AudioRecord.getMinBufferSize(
                              16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                          )
                          if (minBuffer <= 0) throw IllegalStateException("AudioRecord buffer unavailable: " + minBuffer)
                          val probe = AudioRecord(
                              MediaRecorder.AudioSource.VOICE_RECOGNITION, 16000,
                              AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT,
                              maxOf(minBuffer, 5120)
                          )
                          try {
                              if (probe.state != AudioRecord.STATE_INITIALIZED) {
                                  throw IllegalStateException("AudioRecord failed to initialize")
                              }
                              probe.startRecording()
                              if (probe.recordingState != AudioRecord.RECORDSTATE_RECORDING) {
                                  throw IllegalStateException("Android did not start microphone recording")
                              }
                              val sample = ShortArray(1280)
                              val read = probe.read(sample, 0, sample.size)
                              if (read <= 0) throw IllegalStateException("Microphone read failed: " + read)
                          } finally {
                              try { if (probe.recordingState == AudioRecord.RECORDSTATE_RECORDING) probe.stop() } catch (_: Exception) {}
                              probe.release()
                          }
                          val manager = getSystemService(NotificationManager::class.java)
                          manager.notify(NOTIFICATION_ID, makeNotification("Microphone test passed; starting detector"))
                          detector = OpenWakeWord.Builder(applicationContext)
                              .setModel(OpenWakeWord.BuiltInModel.HEY_JARVIS)
                              .setThreshold(0.5f)
                              .build()
                          detector?.start {
                              if (!detectionHandled) handleDetection()
                          }
                          Handler(Looper.getMainLooper()).postDelayed({
                              if (!detectionHandled && detector != null) {
                                  val manager = getSystemService(NotificationManager::class.java)
                                  manager.notify(NOTIFICATION_ID, makeNotification("Detector started; testing wake phrase"))
                              }
                          }, 1500)
                      } catch (e: Throwable) {
                          Log.e("JARVIS-WakeWord", "Could not start wake-word detector", e)
                          val detail = e.javaClass.simpleName + ": " + (e.message ?: "no details")
                          getSharedPreferences("jarvis_wake_word", MODE_PRIVATE)
                              .edit().putString("startup_error", detail).apply()
                          val manager = getSystemService(NotificationManager::class.java)
                          manager.notify(NOTIFICATION_ID, makeNotification("Wake-word error: " + e.javaClass.simpleName))
                      }
                  }
                  return START_STICKY
              }

              private fun handleDetection() {
                  if (detectionHandled) return
                  detectionHandled = true
                  Thread {
                      try {
                          detector?.stop()
                      } catch (e: Exception) {
                          Log.w("JARVIS-WakeWord", "Detector stop failed", e)
                      }
                      Handler(Looper.getMainLooper()).post {
                          val manager = getSystemService(NotificationManager::class.java)
                          manager.notify(NOTIFICATION_ID, makeNotification("Hey JARVIS detected — tap to speak"))
                          val launch = Intent(this, MainActivity::class.java).apply {
                              action = ACTION_WAKE_WORD
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          }
                          try {
                              val creatorOptions = android.app.ActivityOptions.makeBasic()
                                  .setPendingIntentCreatorBackgroundActivityStartMode(
                                      android.app.ActivityOptions.MODE_BACKGROUND_ACTIVITY_START_ALLOWED
                                  )
                              val activityPendingIntent = PendingIntent.getActivity(
                                  this, 5022, launch,
                                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                                  creatorOptions.toBundle()
                              )
                              if (Build.VERSION.SDK_INT >= 34) {
                                  val options = android.app.ActivityOptions.makeBasic()
                                      .setPendingIntentBackgroundActivityStartMode(
                                          android.app.ActivityOptions.MODE_BACKGROUND_ACTIVITY_START_ALLOWED
                                      )
                                  activityPendingIntent.send(
                                      this, 0, null, null, null, null, options.toBundle()
                                  )
                              } else {
                                  activityPendingIntent.send()
                              }
                          } catch (e: Exception) {
                              Log.w("JARVIS-WakeWord", "Activity launch deferred; use the notification", e)
                          }
                      }
                  }.start()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "JARVIS wake-word listening",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun makeNotification(message: String): Notification {
                  val openApp = Intent(this, MainActivity::class.java).apply {
                      action = ACTION_WAKE_WORD
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP
                  }
                  val pending = PendingIntent.getActivity(
                      this, 5021, openApp,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("JARVIS")
                      .setContentText(message)
                      .setContentIntent(pending)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
              }

              override fun onDestroy() {
                  try {
                      detector?.release()
                  } catch (e: Exception) {
                      Log.w("JARVIS-WakeWord", "Detector release failed", e)
                  }
                  detector = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          KOTLIN

      - name: Connect wake-word service to JARVIS voice flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          s = path.read_text()

          # Permission result: distinguish first-time wake-word setup from manual speech.
          pattern = r'if \(granted\) listenOnce\(\)\s*else statusText = "Microphone permission was not granted"'
          replacement = """if (granted) {
                          if (permissionForWakeWord) {
                              permissionForWakeWord = false
                              startWakeWordService()
                          } else {
                              listenOnce()
                          }
                      } else statusText = "Microphone permission was not granted"
          """
          s, count = re.subn(pattern, lambda _: replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not safely update microphone permission callback")

          # Track which action requested microphone permission.
          anchor = "private var conversationActive = false"
          if s.count(anchor) != 1:
              raise SystemExit("Could not locate conversation state")
          s = s.replace(anchor, anchor + "\n    private var permissionForWakeWord = false", 1)

          # Add service startup helper before speech recognition.
          anchor = "    private fun listenOnce() {"
          helper = """    private fun startWakeWordService() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      permissionForWakeWord = true
                      permissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                      return
                  }
                  try {
                      getSharedPreferences("jarvis_wake_word", MODE_PRIVATE).edit()
                          .putString("startup_stage", "start_requested").remove("startup_error").apply()
                      ContextCompat.startForegroundService(
                          this,
                          Intent(this, WakeWordService::class.java)
                      )
                      statusText = "Starting Hey JARVIS service…"
                      android.os.Handler(mainLooper).postDelayed({
                          val prefs = getSharedPreferences("jarvis_wake_word", MODE_PRIVATE)
                          val stage = prefs.getString("startup_stage", "service_not_created")
                          val error = prefs.getString("startup_error", null)
                          statusText = when {
                              error != null -> "Wake-word startup failed: " + error
                              stage == "foreground_started" -> "JARVIS wake-word service is active"
                              stage == "on_start_command" -> "JARVIS service started; checking foreground mode"
                              else -> "Service did not initialise: " + stage
                          }
                      }, 1500)
                  } catch (e: Exception) {
                      statusText = "Wake-word service could not start: " + e.javaClass.simpleName + " — " + (e.message ?: "")
                  }
              }

          """
          if s.count(anchor) != 1:
              raise SystemExit("Could not locate speech recognition method")
          s = s.replace(anchor, helper + anchor, 1)

          # Stop the detector before Android speech recognition takes microphone control.
          anchor = "private fun requestListen() {"
          if s.count(anchor) != 1:
              raise SystemExit("Could not locate requestListen")
          s = s.replace(anchor, anchor + "\n        stopService(Intent(this, WakeWordService::class.java))", 1)

          # App launch starts wake-word standby; assistant and wake-word launches begin speech.
          old = "if (intent?.action == Intent.ACTION_ASSIST) requestListen()"
          new = """if (intent?.action == Intent.ACTION_ASSIST || intent?.action == WakeWordService.ACTION_WAKE_WORD) requestListen()
                  else startWakeWordService()"""
          if s.count(old) != 1:
              raise SystemExit("Could not locate onCreate assistant launch hook")
          s = s.replace(old, new, 1)

          old = "if (intent.action == Intent.ACTION_ASSIST) requestListen()"
          new = "if (intent.action == Intent.ACTION_ASSIST || intent.action == WakeWordService.ACTION_WAKE_WORD) requestListen()"
          if s.count(old) != 1:
              raise SystemExit("Could not locate onNewIntent assistant hook")
          s = s.replace(old, new, 1)

          # After the spoken end-of-conversation message, return to wake-word standby.
          old = "if (conversationActive && !isFinishing) listenOnce()"
          new = """if (!isFinishing) {
                                      if (conversationActive) listenOnce()
                                      else startWakeWordService()
                                  }"""
          if s.count(old) != 1:
              raise SystemExit("Could not locate continuous conversation TTS callback")
          s = s.replace(old, new, 1)

          path.write_text(s)
          print("Wake-word standby integrated with existing JARVIS conversation")
          PY

      - name: Register microphone foreground service

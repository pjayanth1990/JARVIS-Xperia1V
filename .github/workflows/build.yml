          from pathlib import Path
          import os
          import re

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/AndroidManifest.xml"
          s = path.read_text()
          for permission in [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]:
              if permission not in s:
                  s = s.replace('    <uses-permission android:name="android.permission.INTERNET" />',
                                '    <uses-permission android:name="android.permission.INTERNET" />\n' + permission, 1)
          service = '''
                  <service
                      android:name=".WakeWordService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
          '''
          if 'android:name=".WakeWordService"' not in s:
              updated, count = re.subn(r'</application>', service + chr(10) + '    </application>', s, count=1)
              if count != 1:
                  raise SystemExit("Could not locate the application closing tag in AndroidManifest.xml")
              s = updated
          if 'android:name=".WakeWordService"' not in s:
              raise SystemExit("WakeWordService declaration was not inserted into AndroidManifest.xml")
          required = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.POST_NOTIFICATIONS"
          ]
          missing = [p for p in required if p not in s]
          if missing:

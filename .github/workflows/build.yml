
name: Build JARVIS APK

on:
  push:
    paths:
      - 'JARVIS_Xperia1V_Starter.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract JARVIS project
        run: |
          mkdir -p extracted
          unzip -o JARVIS_Xperia1V_Starter.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Rewrite JARVIS MainActivity
        run: |
          cat > "$PROJECT_DIR/app/src/main/java/com/jps/jarvis/MainActivity.kt" <<'KOTLIN'
          package com.jps.jarvis

          import android.Manifest
          import android.app.role.RoleManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Mic
          import androidx.compose.material.icons.filled.SettingsVoice
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat
          import java.util.Locale

          class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var selectedVoiceName by mutableStateOf("System default")
              private var statusText by mutableStateOf("Systems ready")
              private var lastHeard by mutableStateOf("Say a command using the microphone")
              private var reply by mutableStateOf("At your service. JARVIS core is online.")

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) listenOnce()
                      else statusText = "Microphone permission was not granted"
                  }

              private val assistantRoleLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val roleManager = getSystemService(RoleManager::class.java)
                      statusText = when {
                          roleManager?.isRoleHeld(RoleManager.ROLE_ASSISTANT) == true ->
                              "JARVIS is now selected as your default assistant"
                          result.resultCode == RESULT_CANCELED ->
                              "Assistant selection was cancelled or not approved"
                          else ->
                              "Assistant selection returned. Check Android default assistant settings."
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)

                  setContent {
                      JarvisScreen(
                          status = statusText,
                          heard = lastHeard,
                          response = reply,
                          voiceNames = availableVoiceNames(),
                          selectedVoice = selectedVoiceName,
                          onVoiceSelected = { selectVoice(it) },
                          onListen = { requestListen() },
                          onSetDefaultAssistant = { requestAssistantRole() },
                          onSpeakTest = { speak("Voice system check. JARVIS is ready.") }
                      )
                  }
              }

              override fun onInit(result: Int) {
                  ttsReady = result == TextToSpeech.SUCCESS
                  if (ttsReady) {
                      tts?.language = Locale.getDefault()
                      statusText = "Voice output ready · Wake word not yet installed"
                  } else {
                      statusText = "Text-to-speech unavailable"
                  }
              }

              private fun availableVoiceNames(): List<String> =
                  tts?.voices?.map { it.name }?.sorted() ?: emptyList()

              private fun selectVoice(name: String) {
                  val voice = tts?.voices?.firstOrNull { it.name == name }
                  if (voice != null) {
                      tts?.voice = voice
                      selectedVoiceName = name
                      speak("Voice preference updated.")
                  }
              }

              private fun requestListen() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      == PackageManager.PERMISSION_GRANTED) {
                      listenOnce()
                  } else {
                      permissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                  }
              }

              private fun listenOnce() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      statusText = "Speech recognition service is not available"
                      return
                  }

                  val recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  statusText = "Listening…"

                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)
                      putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                  }

                  recognizer.setRecognitionListener(object : android.speech.RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {
                          statusText = "Processing command…"
                      }
                      override fun onError(error: Int) {
                          statusText = "Speech recognition error ($error)"
                          recognizer.destroy()
                      }
                      override fun onResults(results: Bundle?) {
                          val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull().orEmpty()
                          lastHeard = text.ifBlank { "No speech detected" }
                          handleLocalCommand(text)
                          recognizer.destroy()
                      }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })

                  recognizer.startListening(intent)
              }

              private fun handleLocalCommand(raw: String) {
                  val command = raw.lowercase(Locale.ROOT)

                  val result = when {
                      command.contains("hello") || command.contains("hi jarvis") ->
                          "Hello. I'm online and ready."
                      command.contains("time") ->
                          "The current time is ${
                              java.text.SimpleDateFormat("h:mm a", Locale.getDefault())
                                  .format(java.util.Date())
                          }."
                      command.contains("open settings") -> {
                          startActivity(Intent(android.provider.Settings.ACTION_SETTINGS))
                          "Opening Android settings."
                      }
                      command.contains("open camera") -> {
                          val camera = Intent("android.media.action.IMAGE_CAPTURE")
                          if (camera.resolveActivity(packageManager) != null) startActivity(camera)
                          "Opening camera."
                      }
                      command.contains("battery") ->
                          "Your battery level is ${batteryPercent()} percent."
                      else ->
                          "I heard you. Advanced AI connection will be added in a later stage."
                  }

                  reply = result
                  statusText = "Ready"
                  speak(result)
              }

              private fun batteryPercent(): Int {
                  val battery = registerReceiver(
                      null,
                      android.content.IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  )
                  val level = battery?.getIntExtra("level", -1) ?: -1
                  val scale = battery?.getIntExtra("scale", 100) ?: 100
                  return if (level >= 0 && scale > 0) level * 100 / scale else 0
              }

              private fun cleanSpeech(text: String): String {
                  return text
                      .replace(Regex("""(?m)^\s{0,3}#{1,6}\s*"""), "")
                      .replace(Regex("""(?m)^\s*[-+•]\s+"""), "")
                      .replace(Regex("""(?m)^\s*\d+[.)]\s+"""), "")
                      .replace(Regex("""\*\*(.*?)\*\*"""), "$" + "1")
                      .replace(Regex("""\*(.*?)\*"""), "$" + "1")
                      .replace("*", "")
                      .replace("`", "")
                      .replace(Regex("""(?m)^\s*>\s?"""), "")
                      .replace(Regex("""[_~#]"""), "")
                      .replace(Regex("""[ \t]+"""), " ")
                      .replace(Regex("""\n{3,}"""), "\n\n")
                      .trim()
              }

              private fun speak(text: String) {
                  if (ttsReady) {
                      val spokenText = cleanSpeech(text)
                      tts?.speak(spokenText, TextToSpeech.QUEUE_FLUSH, null, "jarvis_reply")
                  }
              }

              private fun requestAssistantRole() {
                  val roleManager = getSystemService(RoleManager::class.java)

                  if (roleManager == null) {
                      statusText = "Android Role Manager is unavailable"
                      return
                  }

                  try {
                      if (!roleManager.isRoleAvailable(RoleManager.ROLE_ASSISTANT)) {
                          statusText = "Android assistant role is not available on this device"
                          return
                      }

                      if (roleManager.isRoleHeld(RoleManager.ROLE_ASSISTANT)) {
                          statusText = "JARVIS is already the selected assistant"
                          return
                      }

                      statusText = "Opening Android assistant selection…"
                      val requestIntent =
                          roleManager.createRequestRoleIntent(RoleManager.ROLE_ASSISTANT)
                      assistantRoleLauncher.launch(requestIntent)

                  } catch (e: Exception) {
                      statusText = "Could not open assistant selection: ${e.javaClass.simpleName}"
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }

          @Composable
          private fun JarvisScreen(
              status: String,
              heard: String,
              response: String,
              voiceNames: List<String>,
              selectedVoice: String,
              onVoiceSelected: (String) -> Unit,
              onListen: () -> Unit,
              onSetDefaultAssistant: () -> Unit,
              onSpeakTest: () -> Unit
          ) {
              val bg = Color(0xFF07111D)
              val cyan = Color(0xFF56D9F2)
              var expanded by remember { mutableStateOf(false) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = bg,
                      surface = Color(0xFF101F2E),
                      primary = cyan,
                      onPrimary = Color(0xFF00131B),
                      onBackground = Color(0xFFE6F7FF),
                      onSurface = Color(0xFFE6F7FF)
                  )
              ) {
                  Surface(modifier = Modifier.fillMaxSize(), color = bg) {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(20.dp),
                          verticalArrangement = Arrangement.spacedBy(16.dp)
                      ) {
                          item {
                              Column(
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("J.A.R.V.I.S.", style = MaterialTheme.typography.headlineLarge, color = cyan)
                                  Text("PERSONAL INTELLIGENCE SYSTEM", style = MaterialTheme.typography.labelSmall, color = Color.LightGray)
                                  Spacer(Modifier.height(24.dp))
                                  Box(
                                      modifier = Modifier.size(190.dp).background(
                                          Brush.radialGradient(
                                              listOf(Color(0xFF174D69), Color(0xFF0A1C2A), bg)
                                          ),
                                          CircleShape
                                      ),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(
                                          Icons.Default.SettingsVoice,
                                          contentDescription = "JARVIS",
                                          tint = cyan,
                                          modifier = Modifier.size(78.dp)
                                      )
                                  }
                                  Spacer(Modifier.height(12.dp))
                                  Text(status, color = cyan, style = MaterialTheme.typography.bodyMedium)
                              }
                          }

                          item {
                              Card(shape = RoundedCornerShape(18.dp)) {
                                  Column(
                                      Modifier.padding(16.dp),
                                      verticalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      Text("VOICE CONSOLE", color = cyan, style = MaterialTheme.typography.titleMedium)
                                      Text("Heard: $heard")
                                      Text("JARVIS: $response")
                                      Button(onClick = onListen, modifier = Modifier.fillMaxWidth()) {
                                          Icon(Icons.Default.Mic, contentDescription = null)
                                          Spacer(Modifier.width(8.dp))
                                          Text("TAP TO SPEAK")
                                      }
                                  }
                              }
                          }

                          item {
                              Card(shape = RoundedCornerShape(18.dp)) {
                                  Column(
                                      Modifier.padding(16.dp),
                                      verticalArrangement = Arrangement.spacedBy(10.dp)
                                  ) {
                                      Text("VOICE PERSONALISATION", color = cyan, style = MaterialTheme.typography.titleMedium)
                                      Text("Choose an installed Android text-to-speech voice.")
                                      Box {
                                          OutlinedButton(
                                              onClick = { expanded = true },
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Text(
                                                  if (selectedVoice == "System default")
                                                      "System default voice" else selectedVoice
                                              )
                                          }

                                          DropdownMenu(
                                              expanded = expanded,
                                              onDismissRequest = { expanded = false }
                                          ) {
                                              DropdownMenuItem(
                                                  text = { Text("System default") },
                                                  onClick = {
                                                      expanded = false
                                                  }
                                              )
                                              voiceNames.take(40).forEach { name ->
                                                  DropdownMenuItem(
                                                      text = { Text(name) },
                                                      onClick = {
                                                          expanded = false
                                                          onVoiceSelected(name)
                                                      }
                                                  )
                                              }
                                          }
                                      }

                                      OutlinedButton(
                                          onClick = onSpeakTest,
                                          modifier = Modifier.fillMaxWidth()
                                      ) {
                                          Text("TEST VOICE")
                                      }
                                  }
                              }
                          }

                          item {
                              Card(shape = RoundedCornerShape(18.dp)) {
                                  Column(
                                      Modifier.padding(16.dp),
                                      verticalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      Text("ANDROID INTEGRATION", color = cyan, style = MaterialTheme.typography.titleMedium)
                                      Text("Register JARVIS as the phone's default digital assistant.")
                                      Button(
                                          onClick = onSetDefaultAssistant,
                                          modifier = Modifier.fillMaxWidth()
                                      ) {
                                          Text("SET AS DEFAULT ASSISTANT")
                                      }
                                      Text(
                                          "Custom wake-word detection and background listening are not included yet.",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = Color.LightGray
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          KOTLIN

   
      - name: Enable automatic listening when assistant launches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          source = path.read_text()

          old = """        }
              }

              override fun onInit(result: Int) {"""

          new = """        }
                  if (intent?.action == Intent.ACTION_ASSIST) requestListen()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent.action == Intent.ACTION_ASSIST) requestListen()
              }

              override fun onInit(result: Int) {"""

          if source.count(old) != 1:
              raise SystemExit("Could not safely locate onCreate closing point")

          path.write_text(source.replace(old, new, 1))
          print("Automatic listening enabled")
          PY
       

      
      
      - name: Enable continuous JARVIS conversation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          s = path.read_text()

          def replace_once(pattern, replacement, description):
              global s
              s2, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit("Could not safely update: " + description)
              s = s2

          replace_once(
              r'import android\.speech\.tts\.TextToSpeech',
              'import android.speech.tts.TextToSpeech\nimport android.speech.tts.UtteranceProgressListener',
              "TTS import"
          )

          replace_once(
              r'(private var ttsReady = false)',
              r'\1\n    private var conversationActive = false',
              "conversation state"
          )

          replace_once(
              r'(private fun requestListen\(\) \{\n)',
              r'\1        conversationActive = true\n',
              "conversation start"
          )

          replace_once(
              r'(val command = raw\.lowercase\(Locale\.ROOT\)\s*)',
              r'\1\n        val stopRequested = command.contains("stop listening")\n        if (stopRequested) conversationActive = false\n',
              "stop command detection"
          )

          replace_once(
              r'(val result = when \{\s*)',
              r'\1stopRequested -> "Conversation ended. Call me whenever you need me."\n',
              "stop command response"
          )

          replace_once(
              r'(if \(ttsReady\) \{\n)(\s*tts\?\.language = Locale\.getDefault\(\))',
              r'''\1            tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(id: String?) {}
                          override fun onDone(id: String?) {
                              runOnUiThread {
                                  if (conversationActive && !isFinishing) listenOnce()
                              }
                          }
                          override fun onError(id: String?) {}
                      })
          \2''',
              "automatic listening after speech"
          )

          replace_once(
              r'(override fun onDestroy\(\) \{\n)',
              r'\1        conversationActive = false\n',
              "conversation cleanup"
          )

          path.write_text(s)
          print("Continuous conversation enabled")
          PY

      - name: Expand offline JARVIS commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          source = path.read_text()

          start = source.find("private fun handleLocalCommand(raw: String) {")
          end = source.find("private fun batteryPercent(): Int {", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate command handler boundaries")

          replacement = """    private fun handleLocalCommand(raw: String) {
              val command = raw.lowercase(Locale.ROOT)
              val stopRequested = command.contains("stop listening")
              if (stopRequested) conversationActive = false

              val result = when {
                  stopRequested ->
                      "Conversation ended. Call me whenever you need me."
                  command.contains("hello") || command.contains("hi jarvis") ->
                      "Hello. I'm online and ready."
                  command.contains("date") || command.contains("what day") || command.contains("today") ->
                      "Today is ${java.text.SimpleDateFormat("EEEE, d MMMM yyyy", Locale.getDefault()).format(java.util.Date())}."
                  command.contains("time") ->
                      "The current time is ${java.text.SimpleDateFormat("h:mm a", Locale.getDefault()).format(java.util.Date())}."
                  command.contains("wifi") || command.contains("wi-fi") -> {
                      startActivity(Intent(android.provider.Settings.ACTION_WIFI_SETTINGS))
                      "Opening Wi-Fi settings."
                  }
                  command.contains("bluetooth") -> {
                      startActivity(Intent(android.provider.Settings.ACTION_BLUETOOTH_SETTINGS))
                      "Opening Bluetooth settings."
                  }
                  command.contains("display settings") || command.contains("screen settings") -> {
                      startActivity(Intent(android.provider.Settings.ACTION_DISPLAY_SETTINGS))
                      "Opening display settings."
                  }
                  command.contains("volume up") || command.contains("increase volume") -> {
                      val audio = getSystemService(AUDIO_SERVICE) as android.media.AudioManager
                      audio.adjustStreamVolume(android.media.AudioManager.STREAM_MUSIC, android.media.AudioManager.ADJUST_RAISE, android.media.AudioManager.FLAG_SHOW_UI)
                      "Increasing media volume."
                  }
                  command.contains("volume down") || command.contains("decrease volume") -> {
                      val audio = getSystemService(AUDIO_SERVICE) as android.media.AudioManager
                      audio.adjustStreamVolume(android.media.AudioManager.STREAM_MUSIC, android.media.AudioManager.ADJUST_LOWER, android.media.AudioManager.FLAG_SHOW_UI)
                      "Decreasing media volume."
                  }
                  command.contains("open settings") -> {
                      startActivity(Intent(android.provider.Settings.ACTION_SETTINGS))
                      "Opening Android settings."
                  }
                  command.contains("open camera") -> {
                      try {
                          val photoPro = packageManager.getLaunchIntentForPackage("com.sonymobile.photopro")
                          val camera = photoPro ?: Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE)
                          if (photoPro != null || camera.resolveActivity(packageManager) != null) {
                              startActivity(camera)
                              "Opening Photography Pro."
                          } else {
                              "I could not find a camera app on this phone."
                          }
                      } catch (e: Exception) {
                          "I could not open the camera app."
                      }
                  }
                  command.contains("battery") ->
                      "Your battery level is ${batteryPercent()} percent."
                  else ->
                      "I heard you. That command is not available offline yet."
              }

              reply = result
              statusText = "Ready"
              speak(result)
          }

          """

          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          print("Offline commands expanded successfully")
          PY

      - name: Connect JARVIS to Cloudflare AI backend
        env:
          JARVIS_WORKER_URL: ${{ secrets.JARVIS_WORKER_URL }}
          JARVIS_CLIENT_TOKEN: ${{ secrets.JARVIS_CLIENT_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          root = Path(os.environ['PROJECT_DIR'])
          worker = os.environ.get('JARVIS_WORKER_URL', '').strip().rstrip('/')
          token = os.environ.get('JARVIS_CLIENT_TOKEN', '').strip()
          if not worker.startswith('https://') or not token:
              raise SystemExit('Missing or invalid JARVIS backend secrets')
          cfg = root / 'app/src/main/java/com/jps/jarvis/JarvisConfig.kt'
          cfg.write_text('package com.jps.jarvis\n\nobject JarvisConfig {\n    const val WORKER_URL = ' + json.dumps(worker) + '\n    const val CLIENT_TOKEN = ' + json.dumps(token) + '\n}\n')
          path = root / 'app/src/main/java/com/jps/jarvis/MainActivity.kt'
          source = path.read_text()
          import_line = 'import java.util.Locale'
          if source.count(import_line) != 1:
              raise SystemExit('Could not safely locate Kotlin imports')
          source = source.replace(import_line, import_line + '\nimport java.net.HttpURLConnection\nimport java.net.URL\nimport org.json.JSONArray\nimport org.json.JSONObject', 1)
          pattern = r'(?m)^\s*else\s*->\s*\n\s*"I heard you\. That command is not available offline yet\."\s*$'
          replacement = '''                  else -> {
                      askJarvisAI(raw)
                      return
                  }'''
          source, count = re.subn(pattern, lambda _: replacement, source, count=1)
          if count != 1:
              raise SystemExit('Could not safely locate offline fallback')
          anchor = '\n}\n\n@Composable\nprivate fun JarvisScreen('
          if source.count(anchor) != 1:
              raise SystemExit('Could not safely locate MainActivity class boundary')
          method = '''    private fun askJarvisAI(question: String) {
              statusText = "Contacting JARVIS AI…"
              Thread {
                  var answer = "I could not connect to my AI service. Check your internet connection."
                  var connection: HttpURLConnection? = null
                  try {
                      connection = (URL(JarvisConfig.WORKER_URL + "/chat").openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          connectTimeout = 15000
                          readTimeout = 30000
                          doOutput = true
                          setRequestProperty("Authorization", "Bearer " + JarvisConfig.CLIENT_TOKEN)
                          setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      }
                      val messages = JSONArray().put(JSONObject().put("role", "user").put("content", question))
                      val payload = JSONObject().put("messages", messages).toString()
                      connection.outputStream.use { it.write(payload.toByteArray(Charsets.UTF_8)) }
                      val code = connection.responseCode
                      val stream = if (code in 200..299) connection.inputStream else connection.errorStream
                      val body = stream?.bufferedReader()?.use { it.readText() }.orEmpty()
                      val data = JSONObject(body)
                      answer = if (code in 200..299) {
                          data.optString("reply").ifBlank { "JARVIS received an empty AI response." }
                      } else {
                          "AI service error. HTTP " + code + ". " + data.optString("error", "Please try again.")
                      }
                  } catch (e: Exception) {
                      answer = "I could not reach the JARVIS AI service. Please check your connection and try again."
                  } finally {
                      connection?.disconnect()
                  }
                  runOnUiThread {
                      reply = answer
                      statusText = "Ready"
                      speak(answer)
                  }
              }.start()
          }
          '''
          source = source.replace(anchor, '\n' + method + '\n}\n\n@Composable\nprivate fun JarvisScreen(', 1)
          path.write_text(source)
          print('Cloudflare AI connection added; credentials were not printed.')
          PY

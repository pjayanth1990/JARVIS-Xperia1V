
name: Build JARVIS APK

on:
  push:
    paths:
      - 'JARVIS_Xperia1V_Starter.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract JARVIS project
        run: |
          mkdir -p extracted
          unzip -o JARVIS_Xperia1V_Starter.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Show JARVIS source files
        run: |
          echo "=== PROJECT FILES ==="
          find "$PROJECT_DIR" -type f | sort
          echo "=== ANDROID MANIFEST ==="
          find "$PROJECT_DIR" -name AndroidManifest.xml -exec cat {} \;
          echo "=== VOICE SERVICE REFERENCES ==="
          grep -RniE "VoiceInteractionService|VoiceInteractionSessionService|ROLE_ASSISTANT|android.voice_interaction" "$PROJECT_DIR" || true

      - name: Show JARVIS assistant code
        run: |
          cd "$PROJECT_DIR"

          echo "===== MAIN ACTIVITY ====="
          cat app/src/main/java/com/jps/jarvis/MainActivity.kt

          echo "===== VOICE INTERACTION SERVICE ====="
          cat app/src/main/java/com/jps/jarvis/JarvisVoiceInteractionService.kt

          echo "===== SESSION SERVICE ====="
          cat app/src/main/java/com/jps/jarvis/JarvisVoiceInteractionSessionService.kt

          echo "===== SESSION ====="
          cat app/src/main/java/com/jps/jarvis/JarvisVoiceInteractionSession.kt

          echo "===== VOICE XML ====="
          cat app/src/main/res/xml/voice_interaction_service.xml

          echo "===== APP GRADLE ====="
          cat app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build JARVIS APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Xperia1V-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

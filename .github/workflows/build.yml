      - name: Fix wake-word return to standby after each command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/jps/jarvis/MainActivity.kt"
          s = path.read_text()

          old = "private fun requestListen() {"
          new = "private fun requestListen(fromWakeWord: Boolean = false) {"
          if s.count(old) != 1:
              raise SystemExit("Could not safely locate requestListen declaration")
          s = s.replace(old, new, 1)

          old = "conversationActive = true"
          if s.count(old) != 1:
              raise SystemExit("Could not safely locate conversation state assignment")
          s = s.replace(old, "conversationActive = true", 1)

          old = "if (intent?.action == Intent.ACTION_ASSIST || intent?.action == WakeWordService.ACTION_WAKE_WORD) requestListen()"
          new = """if (intent?.action == WakeWordService.ACTION_WAKE_WORD) requestListen(fromWakeWord = true)
                  else if (intent?.action == Intent.ACTION_ASSIST) requestListen()"""
          if s.count(old) != 1:
              raise SystemExit("Could not safely locate onCreate wake-word dispatch")
          s = s.replace(old, new, 1)

          old = "if (intent.action == Intent.ACTION_ASSIST || intent.action == WakeWordService.ACTION_WAKE_WORD) requestListen()"
          new = """if (intent.action == WakeWordService.ACTION_WAKE_WORD) requestListen(fromWakeWord = true)
                  else if (intent.action == Intent.ACTION_ASSIST) requestListen()"""
          if s.count(old) != 1:
              raise SystemExit("Could not safely locate onNewIntent wake-word dispatch")
          s = s.replace(old, new, 1)

          # Replace the complete onError callback by locating its Kotlin method boundaries.
          callback_start = s.find("override fun onError(error: Int) {")
          callback_end = s.find("override fun onResults(results: Bundle?) {", callback_start)
          if callback_start < 0 or callback_end < 0:
              raise SystemExit("Could not locate SpeechRecognizer callback boundaries")
          error_callback = """override fun onError(error: Int) {
                          statusText = "Speech recognition error ($error)"
                          recognizer.destroy()
                          if (!conversationActive && !isFinishing) {
                              android.os.Handler(mainLooper).postDelayed({
                                  if (!conversationActive && !isFinishing) startWakeWordService()
                              }, 700)
                          }
                      }
                      """
          s = s[:callback_start] + error_callback + s[callback_end:]

          path.write_text(s)
          print("Wake-word command sessions now return to standby and recover after speech errors")

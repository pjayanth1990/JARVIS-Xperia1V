name: Validate build workflow syntax

on:
  push:
    paths:
      - '.github/workflows/validate-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose build workflow YAML
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          s = File.read('.github/workflows/build.yml')
          begin
            YAML.parse(s)
            puts 'YAML syntax is valid'
          rescue Psych::SyntaxError => e
            puts e.message
            puts "problem=#{e.problem} context=#{e.context} line=#{e.line} column=#{e.column}"
            lines = s.lines
            from = [e.line - 4, 0].max
            puts lines[from, 8].each_with_index.map { |line, i| "#{from + i + 1}: #{line}" }
            begin
              YAML.parse(s.sub(/^on:/m, "'on':"))
              puts "Quoting top-level on: makes YAML parse successfully"
            rescue Psych::SyntaxError => e2
              puts "Quoting on did not fix it: #{e2.message}"
            end
          end
          RUBY

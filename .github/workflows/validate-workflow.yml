name: Validate build workflow syntax

on:
  push:
    paths:
      - '.github/workflows/validate-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose build workflow YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          try:
              yaml.safe_load(s)
              print('YAML syntax is valid')
          except yaml.YAMLError as e:
              print(type(e).__name__, str(e))
              mark = getattr(e, 'problem_mark', None)
              if mark:
                  lines = s.splitlines()
                  start = max(0, mark.line - 4)
                  for i in range(start, min(len(lines), mark.line + 5)):
                      print(f'{i+1}: {lines[i]}')
          PY

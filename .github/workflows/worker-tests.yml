name: JARVIS Worker Contract Tests

on:
  push:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/worker-tests.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/worker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
        working-directory: cloudflare-worker
